{% extends "base.html" %}

{% block title %}Page Not Found (404) — ResQAI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="max-w-700 mx-auto py-5">
    <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-10 text-warning mb-3">
      <i class="bi bi-compass fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark">404 — Page Not Found</h1>
    <p class="lead text-muted mb-4">
      The emergency resource or page you requested could not be located on the server.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-resq-primary">&larr; Return to Home</a>
      <a href="{{ url_for('incidents.report') }}" class="btn btn-outline-danger">Report an Emergency</a>
    </div>
  </div>
</div>
{% endblock %}
